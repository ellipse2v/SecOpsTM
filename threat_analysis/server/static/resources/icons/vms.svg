<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-256 -255 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    VMS monitor with 2x2 camera feed grid.
    evenodd: monitor bezel black → screen white → 4 feed areas black → divider lines white.
    4-px gaps between feeds create visible white grid lines.
  -->
  <path fill-rule="evenodd" fill="#000" d="
    M 28,62 H 484 V 390 H 28 Z
    M 50,84 H 462 V 368 H 50 Z
    M 50,84  H 252 V 224 H 50  Z
    M 260,84  H 462 V 224 H 260 Z
    M 50,232  H 252 V 368 H 50  Z
    M 260,232 H 462 V 368 H 260 Z
  "/>
  <!-- Monitor stand neck -->
  <rect x="224" y="390" width="64" height="36" rx="4" fill="#000"/>
  <!-- Monitor stand base -->
  <rect x="172" y="422" width="168" height="30" rx="10" fill="#000"/>
</svg>
