<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-256 -322 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Ceiling mount plate -->
  <rect x="112" y="28" width="288" height="42" rx="12" fill="#000"/>
  <!-- Housing collar -->
  <rect x="132" y="70" width="248" height="54" rx="8" fill="#000"/>
  <!-- Dome hemisphere (half-ellipse, pointing downward from y=124) -->
  <path d="M 94,124 A 162,172 0 0,1 418,124 Z" fill="#000"/>
  <!-- Dome equator band (ellipse at mount line) -->
  <ellipse cx="256" cy="124" rx="162" ry="22" fill="#000"/>
  <!-- Lens housing protrudes at dome bottom (dome bottom ≈ y=296) -->
  <circle cx="256" cy="296" r="56" fill="#000"/>
  <!-- Lens detail: ring + glass + pupil; glass extends below dome so shows white -->
  <path fill-rule="evenodd" fill="#000"
    d="M 256,296 m -56,0 a 56,56 0 1,0 112,0 a 56,56 0 1,0 -112,0
       M 256,296 m -34,0 a 34,34 0 1,0  68,0 a 34,34 0 1,0  -68,0
       M 256,296 m -14,0 a 14,14 0 1,0  28,0 a 14,14 0 1,0  -28,0"/>
</svg>
