<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-256 -200 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Satellite ground station: parabolic dish on a steerable mast, base platform.
    Content centered in 1024x1024 space.
  -->
  <!-- Base platform -->
  <rect x="176" y="390" width="160" height="28" rx="6" fill="#000"/>
  <!-- Elevation pivot arm -->
  <rect x="247" y="310" width="18" height="80" fill="#000"/>
  <!-- Dish bowl — filled crescent via evenodd: outer arc minus inner arc -->
  <path fill-rule="evenodd" fill="#000" d="
    M 116,296 A 140,96 0 0,1 396,296 L 396,296 A 140,96 0 0,0 116,296 Z
    M 132,296 A 124,80 0 0,1 380,296 L 380,296 A 124,80 0 0,0 132,296 Z
  "/>
  <!-- Simpler dish: solid arc bowl -->
  <path d="M 116,296 A 140,96 0 0,1 396,296 Q 380,282 256,278 Q 132,282 116,296 Z" fill="#000"/>
  <!-- Feed arm strut -->
  <rect x="249" y="210" width="14" height="90" fill="#000"/>
  <!-- Feed horn / LNB -->
  <circle cx="256" cy="206" r="22" fill="#000"/>
  <!-- Azimuth base ring -->
  <rect x="228" y="385" width="56" height="14" rx="4" fill="#000"/>
</svg>
