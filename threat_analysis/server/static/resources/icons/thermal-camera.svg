<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-249 -337 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Wall mount foot -->
  <rect x="110" y="28" width="120" height="38" rx="12" fill="#000"/>
  <!-- Mount arm -->
  <rect x="153" y="66" width="34" height="118" rx="8" fill="#000"/>
  <!-- Camera housing body (ends at x=300 so lens glass at white background) -->
  <rect x="36" y="184" width="264" height="138" rx="22" fill="#000"/>
  <!-- Lens barrel -->
  <rect x="264" y="198" width="72" height="110" rx="10" fill="#000"/>
  <!-- Lens: ring / glass / pupil (evenodd, center x=336) -->
  <path fill-rule="evenodd" fill="#000"
    d="M 336,253 m -48,0 a 48,48 0 1,0  96,0 a 48,48 0 1,0  -96,0
       M 336,253 m -29,0 a 29,29 0 1,0  58,0 a 29,29 0 1,0  -58,0
       M 336,253 m -12,0 a 12,12 0 1,0  24,0 a 12,12 0 1,0  -24,0"/>
  <!-- Thermal emission waves (3 filled crescent arcs emanating right) -->
  <!-- Wave 1: small arc, close to lens -->
  <path d="M 396,224 C 424,230 424,276 396,282 C 407,276 407,230 396,224 Z" fill="#000"/>
  <!-- Wave 2: medium arc -->
  <path d="M 416,208 C 456,218 456,288 416,298 C 430,288 430,218 416,208 Z" fill="#000"/>
  <!-- Wave 3: large arc, farthest -->
  <path d="M 438,192 C 490,206 490,300 438,314 C 455,300 455,206 438,192 Z" fill="#000"/>
</svg>
