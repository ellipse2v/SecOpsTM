<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-256 -276 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    LEO satellite: rectangular bus, two solar panel wings, parabolic antenna dish.
    Content centered in 1024x1024 space for density matching other icons.
  -->
  <!-- Satellite bus body -->
  <rect x="196" y="196" width="120" height="120" rx="8" fill="#000"/>
  <!-- Left solar panel arm -->
  <rect x="166" y="243" width="30" height="26" fill="#000"/>
  <!-- Left solar panel -->
  <rect x="56" y="226" width="120" height="60" rx="4" fill="#000"/>
  <!-- Left panel cell lines (evenodd cutouts) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 56,226 H 176 V 286 H 56 Z
    M 63,233 H 113 V 279 H 63 Z
    M 119,233 H 169 V 279 H 119 Z
  "/>
  <!-- Right solar panel arm -->
  <rect x="316" y="243" width="30" height="26" fill="#000"/>
  <!-- Right solar panel -->
  <rect x="336" y="226" width="120" height="60" rx="4" fill="#000"/>
  <!-- Right panel cell lines (evenodd cutouts) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 336,226 H 456 V 286 H 336 Z
    M 343,233 H 393 V 279 H 343 Z
    M 399,233 H 449 V 279 H 399 Z
  "/>
  <!-- Antenna mast -->
  <rect x="249" y="148" width="14" height="48" fill="#000"/>
  <!-- Antenna dish (parabolic arc) -->
  <path d="M 210,148 A 46,18 0 0,1 302,148 Z" fill="#000"/>
  <!-- Dish feed horn -->
  <circle cx="256" cy="148" r="10" fill="#000"/>
</svg>
