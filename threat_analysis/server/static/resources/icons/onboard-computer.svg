<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-256 -256 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    On-Board Computer (OBC): IC chip package with pins on all four sides.
    evenodd: chip body black → inner die area white → inner circuit area black.
  -->
  <!-- Chip body with inner pattern (evenodd) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 156,156 H 356 V 356 H 156 Z
    M 186,186 H 326 V 326 H 186 Z
    M 212,212 H 300 V 300 H 212 Z
  "/>
  <!-- Pins — left -->
  <rect x="106" y="186" width="42" height="14" rx="3" fill="#000"/>
  <rect x="106" y="216" width="42" height="14" rx="3" fill="#000"/>
  <rect x="106" y="246" width="42" height="14" rx="3" fill="#000"/>
  <rect x="106" y="276" width="42" height="14" rx="3" fill="#000"/>
  <!-- Pins — right -->
  <rect x="364" y="186" width="42" height="14" rx="3" fill="#000"/>
  <rect x="364" y="216" width="42" height="14" rx="3" fill="#000"/>
  <rect x="364" y="246" width="42" height="14" rx="3" fill="#000"/>
  <rect x="364" y="276" width="42" height="14" rx="3" fill="#000"/>
  <!-- Pins — top -->
  <rect x="186" y="106" width="14" height="42" rx="3" fill="#000"/>
  <rect x="216" y="106" width="14" height="42" rx="3" fill="#000"/>
  <rect x="246" y="106" width="14" height="42" rx="3" fill="#000"/>
  <rect x="276" y="106" width="14" height="42" rx="3" fill="#000"/>
  <!-- Pins — bottom -->
  <rect x="186" y="364" width="14" height="42" rx="3" fill="#000"/>
  <rect x="216" y="364" width="14" height="42" rx="3" fill="#000"/>
  <rect x="246" y="364" width="14" height="42" rx="3" fill="#000"/>
  <rect x="276" y="364" width="14" height="42" rx="3" fill="#000"/>
</svg>
