<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="-256 -228 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    TT&C RF link: transmission tower with bidirectional RF waves.
    evenodd: tower body solid, crossbars as cutouts = striped tower effect.
    Solid wave crescents on both sides = RF emission.
  -->
  <!-- Tower base -->
  <rect x="228" y="388" width="56" height="20" rx="4" fill="#000"/>
  <!-- Tower body (tapered trapezoid) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 214,388 L 256,196 L 298,388 Z
    M 236,360 H 276 V 350 H 236 Z
    M 240,320 H 272 V 310 H 240 Z
    M 244,280 H 268 V 270 H 244 Z
  "/>
  <!-- Antenna mast tip -->
  <rect x="250" y="160" width="12" height="36" fill="#000"/>
  <!-- RF waves right (uplink to satellite) -->
  <path d="M 310,224 C 338,236 338,276 310,288 C 322,276 322,236 310,224 Z" fill="#000"/>
  <path d="M 330,208 C 370,224 370,292 330,308 C 346,292 346,224 330,208 Z" fill="#000"/>
  <!-- RF waves left (downlink / ground receive) -->
  <path d="M 202,224 C 174,236 174,276 202,288 C 190,276 190,236 202,224 Z" fill="#000"/>
  <path d="M 182,208 C 142,224 142,292 182,308 C 166,292 166,224 182,208 Z" fill="#000"/>
</svg>
