<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!--
    Smart utility meter: circular face with scale ticks, needle, and digital display.
    evenodd: outer circle black → inner circle (face) white → ticks/needle/display black.
  -->
  <!-- Outer housing ring and face area (evenodd: ring=black, face=white) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 256,32 m -216,0 a 216,216 0 1,0 432,0 a 216,216 0 1,0 -432,0
    M 256,32 m -182,0 a 182,182 0 1,0 364,0 a 182,182 0 1,0 -364,0
  "/>
  <!-- Scale ticks (12 ticks around the face, placed additively) -->
  <!-- Tick positions: every 30deg around circle of radius 158 from center (256,32) -->
  <!-- Top: (256,-126) relative to center → absolute (256,-94) too far; center is (256,256) -->
  <!-- Center of meter: 256,256. Outer tick circle: r=158, inner end r=132 -->
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(0   256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(30  256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(60  256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(90  256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(120 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(150 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(180 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(210 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(240 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(270 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(300 256 256)"/>
  <rect x="246" y="66"  width="20" height="40" rx="4" fill="#000" transform="rotate(330 256 256)"/>
  <!-- Needle (pointing to ~10 o'clock = 300deg from top, i.e. -60deg from vertical) -->
  <rect x="249" y="118" width="14" height="130" rx="6" fill="#000"
        transform="rotate(-60 256 256)"/>
  <!-- Center hub -->
  <circle cx="256" cy="256" r="22" fill="#000"/>
  <!-- Digital display box (lower portion of face) -->
  <rect x="184" y="328" width="144" height="52" rx="8" fill="#000"/>
  <!-- Display screen (evenodd hole inside display) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 184,328 H 328 V 380 H 184 Z
    M 196,338 H 316 V 370 H 196 Z
  "/>
</svg>
