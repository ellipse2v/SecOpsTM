# SecOpsTM Community Protocol Registry
# Each entry maps a protocol to MITRE ATT&CK tactic boosts and key techniques.
#
# To add a new protocol: see CONTRIBUTING_ASSET_TYPES.md
#
# Fields:
#   tactic_boost  : kebab-case tactic IDs boosted when this protocol is exposed on an asset
#   key_techniques: technique IDs always boosted when this protocol service is present

protocols:

  ssh:
    tactic_boost: [initial-access, lateral-movement]
    key_techniques: [T1021.004, T1098.004]

  rdp:
    tactic_boost: [initial-access, lateral-movement]
    key_techniques: [T1021.001, T1078]

  smb:
    tactic_boost: [lateral-movement, credential-access]
    key_techniques: [T1021.002, T1570, T1039]

  ldap:
    tactic_boost: [credential-access, discovery]
    key_techniques: [T1069.002, T1087.002]

  kerberos:
    tactic_boost: [credential-access]
    key_techniques: [T1558.003, T1558.001]

  http:
    tactic_boost: [initial-access]
    key_techniques: []

  https:
    tactic_boost: [initial-access]
    key_techniques: []

  sql:
    tactic_boost: [credential-access, collection, exfiltration]
    key_techniques: [T1190, T1078, T1048]

  winrm:
    tactic_boost: [lateral-movement, execution]
    key_techniques: [T1021.006]

  rpc:
    tactic_boost: [lateral-movement]
    key_techniques: []

  ftp:
    tactic_boost: [exfiltration]
    key_techniques: [T1048.003]

  smtp:
    tactic_boost: [initial-access, collection]
    key_techniques: [T1566, T1114]

  modbus:
    tactic_boost: [execution, impact]
    key_techniques: [T1565.001, T1498]

  ipsec:
    tactic_boost: [initial-access]
    key_techniques: []

  dns:
    tactic_boost: [command-and-control, defense-evasion]
    key_techniques: [T1071.004, T1568]

  sap:
    tactic_boost: [credential-access, collection]
    key_techniques: []

  syslog:
    tactic_boost: [collection, defense-evasion]
    key_techniques: []

  # ── IoT & Video Surveillance protocols ──────────────────────────────────────

  rtsp:
    tactic_boost: [collection, exfiltration]
    key_techniques: [T1040, T1048.002]

  onvif:
    tactic_boost: [initial-access, execution, collection]
    key_techniques: [T1190, T1059, T1040]

  mqtt:
    tactic_boost: [command-and-control, initial-access]
    key_techniques: [T1071.001, T1190]

  coap:
    tactic_boost: [command-and-control, initial-access]
    key_techniques: [T1071.001, T1190]

  zigbee:
    tactic_boost: [initial-access, lateral-movement]
    key_techniques: [T1190, T1021]

  zwave:
    tactic_boost: [initial-access, lateral-movement]
    key_techniques: [T1190, T1021]
