# SecOpsTM Community Asset Type Registry
# Each entry maps an asset type to MITRE ATT&CK platforms, tactics, and key techniques.
#
# To add a new type: see CONTRIBUTING_ASSET_TYPES.md
#
# Fields:
#   description   : human-readable description
#   category      : endpoint | network | server | ot | iot | cloud | identity
#   platforms     : MITRE ATT&CK platform names (exact case required)
#   tactics       : kebab-case tactic IDs, ordered by likelihood for this asset type
#   key_techniques: high-value technique IDs to boost in scoring (empty list if none)
#   fuzzy_matches : lowercase substrings used by _normalize_type() for loose matching
#   icon_url      : path relative to Flask static root, e.g. /static/resources/icons/firewall.svg
#                   Empty string means no icon; config_generator.py reads this to build ICON_MAPPING.

asset_types:

  firewall:
    description: "Network firewall or packet-filtering device"
    category: network
    platforms: [Network Devices]
    tactics: [initial-access, defense-evasion, lateral-movement]
    key_techniques: [T1190, T1600, T1599]
    fuzzy_matches: [firewall, fw]
    icon_url: "/static/resources/icons/firewall.svg"

  # NOTE: pki must appear before auth-server in this file.
  # "certificate-authority" contains "auth" — pki's fuzzy_matches are checked first
  # because _normalize_type() iterates entries in YAML declaration order.
  pki:
    description: "Public Key Infrastructure / Certificate Authority"
    category: identity
    platforms: [Windows]
    tactics: [credential-access, privilege-escalation]
    key_techniques: []
    fuzzy_matches: [pki, certificate]
    icon_url: ""

  domain-controller:
    description: "Active Directory Domain Controller"
    category: identity
    platforms: [Windows]
    tactics: [credential-access, privilege-escalation, persistence, lateral-movement]
    key_techniques: [T1550.002, T1558.003, T1003.006, T1558.001, T1003.001, T1207]
    fuzzy_matches: [domain, dc]
    icon_url: ""

  auth-server:
    description: "Authentication server (RADIUS, LDAP, SSO)"
    category: identity
    platforms: [Windows, Linux]
    tactics: [credential-access, privilege-escalation, initial-access]
    key_techniques: [T1110, T1212, T1528, T1550]
    fuzzy_matches: [auth]
    icon_url: ""

  database:
    description: "Relational or NoSQL database server"
    category: server
    platforms: [Windows, Linux]
    tactics: [credential-access, collection, exfiltration]
    key_techniques: [T1190, T1078, T1048, T1030]
    fuzzy_matches: [database, db, sql]
    icon_url: "/static/resources/icons/database.svg"

  web-server:
    description: "HTTP/HTTPS web application server"
    category: server
    platforms: [Windows, Linux]
    tactics: [initial-access, execution, persistence]
    key_techniques: []
    fuzzy_matches: [web server, web-server, webserver]
    icon_url: "/static/resources/icons/web-server.svg"

  api-gateway:
    description: "API gateway or reverse proxy"
    category: server
    platforms: [Windows, Linux]
    tactics: [initial-access, execution]
    key_techniques: []
    fuzzy_matches: [api-gateway, api gateway]
    icon_url: "/static/resources/icons/api-gateway.svg"

  file-server:
    description: "File sharing server (SMB, NFS)"
    category: server
    platforms: [Windows, Linux]
    tactics: [collection, lateral-movement, exfiltration]
    key_techniques: [T1021.002, T1039, T1083, T1135]
    fuzzy_matches: [file]
    icon_url: ""

  mail-server:
    description: "Email server (Exchange, Postfix)"
    category: server
    platforms: [Windows, Linux, Office Suite]
    tactics: [initial-access, collection]
    key_techniques: [T1566, T1114, T1071.003]
    fuzzy_matches: [mail, email, smtp, exchange]
    icon_url: ""

  management-server:
    description: "IT management, jump server, or privileged access workstation"
    category: server
    platforms: [Windows, Linux]
    tactics: [lateral-movement, privilege-escalation, execution]
    key_techniques: [T1021.001, T1078, T1570]
    fuzzy_matches: [jump, bastion, paw]
    icon_url: ""

  workstation:
    description: "Standard end-user workstation or laptop"
    category: endpoint
    platforms: [Windows]
    tactics: [execution, persistence, privilege-escalation, credential-access]
    key_techniques: [T1566.001, T1059.001, T1059.003, T1204.002, T1003.001, T1055]
    fuzzy_matches: [workstation, laptop, desktop]
    icon_url: ""

  load-balancer:
    description: "Network load balancer"
    category: network
    platforms: [Network Devices, Linux]
    tactics: [initial-access, defense-evasion]
    key_techniques: []
    fuzzy_matches: [load-balancer, load balancer]
    icon_url: "/static/resources/icons/load_balancer.svg"

  # NOTE: vpn.fuzzy_matches is intentionally empty. Any input containing "vpn" resolves to
  # vpn-gateway (which has fuzzy_matches: [vpn]). The "vpn" entry is only reached when the
  # asset type is passed as the exact string "vpn".
  vpn:
    description: "VPN client endpoint or concentrator"
    category: network
    platforms: [Network Devices]
    tactics: [initial-access, credential-access]
    key_techniques: []
    fuzzy_matches: []
    icon_url: ""

  vpn-gateway:
    description: "VPN gateway or remote access server"
    category: network
    platforms: [Network Devices]
    tactics: [initial-access, credential-access]
    key_techniques: [T1078, T1133, T1110]
    fuzzy_matches: [vpn]
    icon_url: ""

  scada:
    description: "SCADA system or Human-Machine Interface"
    category: ot
    platforms: [Windows, Linux]
    tactics: [initial-access, execution, impact]
    key_techniques: [T1021.001, T1133, T1078]
    fuzzy_matches: [scada, hmi]
    icon_url: ""

  plc:
    description: "Programmable Logic Controller or RTU in ICS/OT environment"
    category: ot
    platforms: [Linux]
    tactics: [impact, execution]
    key_techniques: [T1565.001, T1498, T1489]
    fuzzy_matches: [plc, controller, rtu]
    icon_url: ""

  repository:
    description: "Source code repository server (Git, SVN)"
    category: server
    platforms: [Linux]
    tactics: [collection, exfiltration]
    key_techniques: []
    fuzzy_matches: [repository, git, repo]
    icon_url: ""

  cicd:
    description: "CI/CD pipeline server (Jenkins, GitLab CI, GitHub Actions runner)"
    category: server
    platforms: [Linux]
    tactics: [execution, persistence, lateral-movement]
    key_techniques: [T1195.002, T1059, T1525]
    fuzzy_matches: [cicd, ci_cd, pipeline, jenkins]
    icon_url: ""

  backup:
    description: "Backup server or storage appliance"
    category: server
    platforms: [Linux, Windows]
    tactics: [collection, exfiltration, impact]
    key_techniques: []
    fuzzy_matches: [backup]
    icon_url: ""

  dns:
    description: "DNS server"
    category: server
    platforms: [Windows, Linux]
    tactics: [defense-evasion, lateral-movement, command-and-control]
    key_techniques: []
    fuzzy_matches: [dns]
    icon_url: ""

  siem:
    description: "Security Information and Event Management system"
    category: server
    platforms: [Linux]
    tactics: [defense-evasion, collection]
    key_techniques: []
    fuzzy_matches: [siem, log]
    icon_url: ""

  # ── IoT & Video Surveillance ────────────────────────────────────────────────

  # NOTE: ip-camera must appear before ptz-camera and thermal-camera.
  # "ptz" and "thermal" do not contain "cam", so ordering is not critical here,
  # but ip-camera is the most common fallback for any generic camera match.
  ip-camera:
    description: "IP surveillance camera (indoor/outdoor, fixed lens)"
    category: iot
    platforms: [Linux, Embedded]
    tactics: [initial-access, execution, collection, impact, command-and-control]
    key_techniques: [T1190, T1110, T1040, T1056, T1059, T1498, T1583]
    fuzzy_matches: [camera, ipcam, cctv, cam, ip cam]
    icon_url: "/static/resources/icons/ip-camera.svg"

  ptz-camera:
    description: "Pan-Tilt-Zoom motorized surveillance camera (ONVIF-controlled)"
    category: iot
    platforms: [Linux, Embedded]
    tactics: [initial-access, execution, collection, impact]
    key_techniques: [T1190, T1059, T1040, T1565, T1110]
    fuzzy_matches: [ptz, pan-tilt, pan tilt]
    icon_url: "/static/resources/icons/ptz-camera.svg"

  thermal-camera:
    description: "Thermal / infrared imaging camera for perimeter detection"
    category: iot
    platforms: [Linux, Embedded]
    tactics: [initial-access, collection, exfiltration]
    key_techniques: [T1190, T1040, T1048]
    fuzzy_matches: [thermal, infrared, ir-camera, ir camera]
    icon_url: "/static/resources/icons/thermal-camera.svg"

  nvr:
    description: "Network Video Recorder — stores and indexes IP camera feeds"
    category: iot
    platforms: [Linux, Windows, Embedded]
    tactics: [initial-access, collection, exfiltration, impact]
    key_techniques: [T1190, T1078, T1005, T1048, T1485]
    fuzzy_matches: [nvr, dvr, video recorder, network video]
    icon_url: "/static/resources/icons/nvr.svg"

  # NOTE: vms (Video Management System) must appear before any entry whose
  # fuzzy_matches contain "video" to avoid shadowing.
  vms:
    description: "Video Management System — centralized camera lifecycle platform"
    category: server
    platforms: [Windows, Linux]
    tactics: [initial-access, privilege-escalation, collection, lateral-movement]
    key_techniques: [T1190, T1078, T1003, T1021]
    fuzzy_matches: [vms, video management, surveillance platform]
    icon_url: "/static/resources/icons/vms.svg"

  rtsp-server:
    description: "RTSP / ONVIF streaming media relay server"
    category: server
    platforms: [Linux]
    tactics: [collection, exfiltration, defense-evasion]
    key_techniques: [T1040, T1048.002, T1071.001]
    fuzzy_matches: [rtsp, onvif, streaming, media relay]
    icon_url: "/static/resources/icons/rtsp-server.svg"

  iot-gateway:
    description: "IoT protocol gateway (MQTT broker, CoAP proxy, Zigbee/Z-Wave hub)"
    category: iot
    platforms: [Linux, Embedded]
    tactics: [initial-access, execution, lateral-movement, command-and-control]
    key_techniques: [T1190, T1059, T1021, T1071.001]
    fuzzy_matches: [iot gateway, mqtt broker, zigbee hub, zwave, coap proxy]
    icon_url: "/static/resources/icons/iot-gateway.svg"

  smart-lock:
    description: "Smart lock or electronic access control device"
    category: iot
    platforms: [Embedded, Android, iOS]
    tactics: [initial-access, impact, credential-access]
    key_techniques: [T1190, T1110, T1552, T1531]
    fuzzy_matches: [smart lock, access control, badge reader, electronic lock]
    icon_url: "/static/resources/icons/smart-lock.svg"

  smart-meter:
    description: "Smart utility meter (electricity, gas, water) with AMI radio"
    category: iot
    platforms: [Embedded]
    tactics: [initial-access, collection, impact]
    key_techniques: [T1190, T1040, T1565.001]
    fuzzy_matches: [smart meter, meter, amr, ami]
    icon_url: "/static/resources/icons/smart-meter.svg"

  # ── Default ─────────────────────────────────────────────────────────────────

  default:
    description: "Fallback for unknown asset types"
    category: server
    platforms: [Windows, Linux]
    tactics: [initial-access, execution, lateral-movement]
    key_techniques: []
    fuzzy_matches: []
    icon_url: ""
