# ── Risk Criteria ──────────────────────────────────────────────────────────────
risk_criteria:
  max_hops: 6
  max_paths_per_objective: 3
  gdaf_min_technique_score: 0.6
  acceptable_risk_threshold: 6.0

compliance_requirements:
  - NIST SP 800-53 Rev 5 (SC, SI, AU controls)
  - CCSDS Security Architecture (SDLS protocol, 350.0-G-3)
  - SPARTA Space Attack Research and Tactic Analysis framework
  - ESA Space System Cybersecurity Requirements (ECSS-E-ST-10-04C draft)
  - ITU Radio Regulations (interference / jamming prohibition)
