system_description: 'The DJI Power Inspection Drone System is an integrated unmanned aerial vehicle (UAV) solution designed
  for electrical infrastructure inspection, including power lines, substations, and transmission towers. The system comprises
  aircraft platforms (Matrice 350 RTK, M30T, M400, Mavic 3 Enterprise), ground control systems (RC Plus controller, mobile
  devices with DJI Pilot 2), backend analysis workstations (DJI Terra), and optional cloud services (FlightHub 2, DJI Account
  servers, RTK services).


  The system supports three network security modes: Standard Mode (full connectivity), Restricted Network Mode (maps/RTK/cloud
  services only, no DJI account), and Local Data Mode (LDM) which provides complete network isolation. This threat model focuses
  on a deployment scenario for critical power infrastructure inspection with high-security requirements.'
