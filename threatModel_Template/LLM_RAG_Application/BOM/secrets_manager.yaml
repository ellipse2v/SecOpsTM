# BOM: Secrets Manager
asset: "Secrets Manager"
software_version: "Managed cloud secrets manager (KMS-backed)"
patch_level: current
known_cves: []
running_services:
  - Secrets API (HTTPS 443)
  - Automatic rotation for database credentials
detection_level: high
credentials_stored: true
notes: >
  Stores the LLM provider API key, database credentials and tool service tokens. The provider
  key is rotated manually and is not scoped per environment, so a leak allows unlimited spend
  until it is revoked. Access is limited to the orchestrator, tool gateway and ingestion
  identities.
