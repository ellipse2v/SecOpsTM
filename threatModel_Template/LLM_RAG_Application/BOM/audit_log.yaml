# BOM: Audit Log
asset: "Audit Log"
software_version: "OpenSearch 2.11 (managed)"
patch_level: current
known_cves: []
running_services:
  - HTTPS ingest (443)
  - Dashboards
  - Alerting
detection_level: high
credentials_stored: false
notes: >
  Receives prompts, responses, retrieved document IDs and tool calls. Prompts and responses
  contain PII and sometimes secrets pasted by users, so the index is access controlled and has
  a retention limit. Alerts on spikes in tokens per user and on guardrail blocks.
