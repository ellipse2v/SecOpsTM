# BOM: Ticketing Service
asset: "Ticketing Service"
os_version: "debian_12"
software_version: "Python 3.11 with Django 5.0"
patch_level: current
known_cves: []
running_services:
  - HTTPS API (8443)
  - Ticket workflow engine
detection_level: medium
credentials_stored: true
notes: >
  Accepts ticket create and update calls from the tool gateway with one shared service token,
  so tickets cannot be attributed to a user or a model turn. Ticket text is later shown to
  staff and could be indexed, which makes it a possible injection carrier.
