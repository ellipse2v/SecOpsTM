# BOM: Ingestion Pipeline
asset: "Ingestion Pipeline"
os_version: "debian_12"
software_version: "Python 3.11 workers with unstructured 0.12 and PyMuPDF for parsing"
patch_level: current
known_cves: []
running_services:
  - Queue consumer
  - Document parsers (PDF, DOCX, HTML)
  - Chunker and embedding client
detection_level: medium
credentials_stored: true
notes: >
  Parses untrusted files, so parser workers run in a sandboxed container with no outbound
  network except the embedding endpoint. Hidden text, white-on-white text and metadata fields
  can carry injected instructions into chunks. There is no malware or prompt-injection scan
  before indexing, a missing control that should sit between the document store and this
  pipeline. Holds the embedding API key and the vector database write key.
