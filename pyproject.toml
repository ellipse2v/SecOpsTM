[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "SecOpsTM"
version = "1.1.1a24"
authors = [
  { name="ellipse2v", email="ellipse2v@gmail.com" },
]
description = "A STRIDE threat analysis framework with MITRE ATT&CK integration."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pytm==1.4.0",  # pinned exact — see requirements.txt comment / decisions.md
    "Flask[async]",
    "Jinja2",
    "graphviz",
    "pandas",
    "PyYAML",
    "lxml",
    "openpyxl",
    "msoffcrypto-tool",
    "aiohttp",
    "litellm>=1.32.2",
    "chromadb>=0.4.24",
    "sentence-transformers>=2.7.0",
]

[project.urls]
"Homepage" = "https://github.com/ellipse2v/SecOpsTM"
"Bug Tracker" = "https://github.com/ellipse2v/SecOpsTM/issues"

[project.scripts]
secopstm = "threat_analysis.__main__:main"

[tool.setuptools.packages.find]
where = ["."] # Search for packages in the current directory
include = ["threat_analysis*"] # Include threat_analysis and its subpackages

[tool.setuptools.package-data]
"threat_analysis" = [
    "config/*.yaml",
    "server/static/**/*",
    "server/templates/**/*",
    "templates/**/*",
    "external_data/*.json",
    "external_data/*.csv",
    "external_data/*.xml",
    "external_data/*.xlsx",
    "external_data/cve2capec/*.jsonl",
    "schemas/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tooling", "venv-py310", "venv", ".venv", "output", "node_modules"]

[tool.coverage.run]
omit = ["tests/*"]
