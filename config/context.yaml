# System Context
system_description: "A web-based patient portal for accessing medical records, scheduling appointments, and communicating with healthcare providers. Built with React frontend and Node.js backend..."

# bom_directory: "./BOM"   # Uncomment and set path to a directory of per-asset BOM YAML files

# GDAF risk criteria (used when attack_objectives and threat_actors are defined)
risk_criteria:
  acceptable_risk_score: 5.0
  max_hops: 7
  max_paths_per_objective: 3
  # Minimum ScoredTechnique score to render a technique as an OR branch in Attack Flow .afb files.
  # Techniques below this threshold are still used for hop scoring but not displayed.
  gdaf_min_technique_score: 0.8

# Security Context
data_sensitivity: "PHI"
internet_facing: true
compliance_requirements:
  - "HIPAA"
  - "GDPR"
deployment_environment: "Kubernetes"
integrations:
  - "EHR system"
  - "Payment gateway"
  - "Email service"
user_base: "100,000 patients"
