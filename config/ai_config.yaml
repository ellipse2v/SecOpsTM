# =============================================================================
# config/ai_config.yaml — SecOpsTM AI & GDAF configuration
# =============================================================================
#
# SECTION 1 — Choose your AI provider
#   Enable exactly one provider. Set the matching API key as an environment
#   variable (e.g. export MISTRAL_API_KEY=...).
#   SecOpsTM works fully offline without AI — AI features are additive.
#
# SECTION 2 — Generation settings (optional tuning)
#   Adjust volume, rate limits, and ranking weights. Defaults work for most cases.
#
# SECTION 3 — RAG, embeddings, and GDAF (advanced)
#   Do not modify embeddings without rebuilding the vector store
#   (tooling/build_vector_store.py).
# =============================================================================

# ---------------------------------------------------------------------------
# Enterprise SSL — set when your company uses a custom CA / SSL inspection proxy.
# ssl_cert_file: "/etc/ssl/certs/company-ca.pem"
# ---------------------------------------------------------------------------

# =============================================================================
# SECTION 1 — AI provider (enable exactly one)
# =============================================================================
ai_providers:
  mistral:
    enabled: false
    model: "mistral-small-latest"
    api_key_env: "MISTRAL_API_KEY"
    api_base: ""       # Enterprise: http://mistral.internal:8000/v1
    temperature: 0.3
    max_tokens: 4096
    timeout: 30
    ssl_verify: true   # false | "/path/to/ca-bundle.crt" for self-signed certs
    # enable_thinking: false  # vLLM/Qwen3-style hybrid thinking toggle — only set this on providers
    # that actually accept an `enable_thinking` request field. The Anthropic API does NOT (it uses a
    # nested `thinking: {type: ...}` object instead) — setting this under the anthropic: block causes
    # every request to fail with "enable_thinking: Extra inputs are not permitted".

  gemini:
    enabled: false
    model: "gemini-flash-latest"
    api_key_env: "GOOGLE_API_KEY"
    api_base: ""
    temperature: 0.3
    max_tokens: 4096
    timeout: 30
    ssl_verify: true

  openai:
    enabled: false
    model: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    api_base: ""
    ssl_verify: true

  # Anthropic API — https://console.anthropic.com (separate from a Claude Pro/Code
  # subscription; needs its own pay-as-you-go API key)
  # export ANTHROPIC_API_KEY=sk-ant-...
  anthropic:
    enabled: true
    model: "claude-haiku-4-5"   # fast/cheap for iteration; "claude-sonnet-5" for higher quality
    api_key_env: "ANTHROPIC_API_KEY"
    temperature: 0.2
    # 1024 truncated batch calls: the STRIDE schema asks for 3-5 threats per component
    # with ~12 fields each (attack_scenario, business_impact object, capec/cwe/d3fend
    # lists, ...), and this value also floors the batch ceiling (max_tokens x4 in
    # generate_threats_batch) — 1024 capped a 5-component batch at 4096 tokens total
    # and cut the JSON off mid-response. 8192 still truncated some 5-component batches
    # on Haiku's verbose output — raised further. Haiku 4.5 supports up to 64K output,
    # so this only raises the ceiling, not actual usage/cost.
    max_tokens: 16000
    timeout: 30
    ssl_verify: true

  # NVIDIA Integrate API (OpenAI-compatible) — https://build.nvidia.com/models
  # export NVIDIA_NIM_API_KEY=nvapi-...
  nvidia_nim:
    enabled: false
    model: "meta/llama-3.3-70b-instruct"      # any model from build.nvidia.com
    api_key_env: "NVIDIA_NIM_API_KEY"
    api_base: "https://integrate.api.nvidia.com/v1"
    temperature: 0.2
    top_p: 0.7
    max_tokens: 1024
    timeout: 60
    ssl_verify: true

  ollama:
    enabled: false
    model: "llama3:8b-instruct-q4_K_M"
    host: "http://127.0.0.1:11434"
    stream: true
    num_ctx: 4096
    num_predict: 4096
    temperature: 0.3
    attack_flow_temperature: 0.2   # lower = more deterministic for structured JSON output
    timeout: 60                    # aiohttp session timeout (seconds); connection-level
    ssl_verify: true
    # Note: Ollama retry count (3 attempts, exponential back-off) is fixed in
    # ollama_provider.py and is not configurable via this file.

# =============================================================================
# SECTION 2 — Generation settings
# =============================================================================
threat_generation:
  mode: "hybrid"             # "traditional" | "ai" | "hybrid"
  fallback_to_traditional: true
  # Per-component cap on AI-generated threats kept (0 = no limit). When more than this
  # many are returned, the highest-confidence ones are kept.
  max_threats_per_component: 10

  # Rate limiting — set to 1.5 for Gemini free tier (15 RPM), 0.0 for paid/Ollama
  rate_limit_sleep: 1.5
  # Concurrency — 1 = sequential (safe for free tiers); 3–5 for paid/Ollama
  max_concurrent_ai_requests: 3
  # Batch enrichment — components grouped per LLM call (5 = 5× fewer API round trips)
  # Set to 1 to disable batching and fall back to one call per component
  batch_size: 5

  # Volume control (0 = no limit)
  max_total_threats: 0
  # Guarantee at least one threat per STRIDE category even if above cut-off
  min_stride_coverage: true

  # Composite ranking weights (must sum to 1.0)
  ranking_weights:
    severity: 0.4
    confidence: 0.3
    risk_signals: 0.3

  # AI-generated threats below this confidence (0.0-1.0) are dropped before being
  # attached to the model.
  confidence_threshold: 0.75

  # LiteLLM retry policy — applies to all providers
  num_retries: 3         # automatic retries on rate-limit / transient errors
  # Batch token budget — tokens allocated per component in a batch call (default 600).
  # 2 000 was the previous default but caused timeouts on slow free-tier providers (70B models).
  # Raise only if threats are being truncated; reduce if you still hit timeouts.
  batch_tokens_per_component: 600
  # Batch timeout multiplier — batch timeout = provider timeout × this factor.
  # With timeout: 60 and factor: 2.0, batch calls get 120 s instead of 60 s.
  batch_timeout_factor: 2.0

  # Minimum token budget for CISO triage calls (budget = max(this, provider max_tokens))
  ciso_triage_min_tokens: 2000

  # Timeouts for sync wrappers (seconds) — increase for slow hardware or large models
  sync_timeouts:
    rag_prewarm: 300     # asyncio.wait_for for RAG pre-warm in init_ai()
    rag_sync: 120        # future.result timeout in generate_rag_threats_sync()
    markdown_sync: 180   # future.result timeout in generate_markdown_from_prompt_sync()

# =============================================================================
# SECTION 3 — RAG, embeddings, and GDAF (advanced)
# =============================================================================

# RAG — retrieval-augmented generation from the local vector store
rag:
  enabled: true
  vector_db: "chroma"
  top_k_examples: 5

# Embeddings — default is local HuggingFace (no API key, works offline)
# WARNING: changing the model requires rebuilding the vector store:
#   python tooling/build_vector_store.py
embedding:
  provider: huggingface        # huggingface | google | mistral | ollama
  model: all-MiniLM-L6-v2
  device: cpu                  # cpu | cuda
  api_base: ""
  ssl_verify: true

# "Automatically Discovered Attack Paths" — the STRIDE-technique-based attack path
# finder (AttackFlowGenerator), independent of GDAF. Scope: only the HTML report
# section built by generate_html_report(); the standalone .afb export flows (CLI
# --attack-flow, server's dedicated "Export Attack Flow" button) always use every
# STRIDE category regardless of generate_for_categories, since they're meant to be a
# complete, unfiltered dump of what pytm/AI found.
attack_flows:
  enabled: true
  generate_for_categories: ["Tampering", "Information Disclosure", "Elevation of Privilege"]

# GDAF engine defaults — override per model via gdaf_min_technique_score in ## Context
# or via risk_criteria in the per-model GDAF context YAML
gdaf:
  risk_criteria:
    acceptable_risk_score: 5.0
    max_hops: 7
    max_paths_per_objective: 3
    gdaf_min_technique_score: 0.8

# Red/Blue adversarial debate over the top-N GDAF attack scenarios (opt-in).
# See docs/gdaf.md. Runs after GDAF and before the HTML report is written.
debate:
  enabled: true
  top_n: 5
  min_viability_threshold: 0.5
  max_rounds: 3
  viability_delta_threshold: 0.1
  debate_factor_min: 0.5
  debate_factor_max: 1.5

# Fine-tuning (Phase 3 — optional, not enabled by default)
fine_tuning:
  enabled: false
  base_model: "mistralai/Ministral-8B"
  lora_rank: 16
  lora_alpha: 32
  dataset_path: "data/training/threat_dataset.jsonl"
