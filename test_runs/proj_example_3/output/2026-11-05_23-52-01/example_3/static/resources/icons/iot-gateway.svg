<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Antenna tip ball -->
  <circle cx="256" cy="44" r="22" fill="#000"/>
  <!-- Antenna mast -->
  <rect x="242" y="66" width="28" height="126" rx="8" fill="#000"/>
  <!-- WiFi arc 1 (small, innermost) -->
  <path d="M 214,178 A 48,44 0 0,1 298,178 L 286,184 A 32,28 0 0,0 226,184 Z" fill="#000"/>
  <!-- WiFi arc 2 (medium) -->
  <path d="M 182,162 A 80,74 0 0,1 330,162 L 316,170 A 62,56 0 0,0 196,170 Z" fill="#000"/>
  <!-- WiFi arc 3 (large, outermost) -->
  <path d="M 150,146 A 112,104 0 0,1 362,146 L 346,156 A 94,86 0 0,0 166,156 Z" fill="#000"/>
  <!-- Gateway body (flat router/hub shape) -->
  <rect x="48" y="218" width="416" height="148" rx="18" fill="#000"/>
  <!-- LED indicator holes (4 circles, evenodd) -->
  <path fill-rule="evenodd" fill="#000" d="
    M 48,218 H 464 V 366 H 48 Z
    M 86,268  m -20,0 a 20,20 0 1,0 40,0 a 20,20 0 1,0 -40,0
    M 134,268 m -20,0 a 20,20 0 1,0 40,0 a 20,20 0 1,0 -40,0
    M 182,268 m -20,0 a 20,20 0 1,0 40,0 a 20,20 0 1,0 -40,0
    M 230,268 m -20,0 a 20,20 0 1,0 40,0 a 20,20 0 1,0 -40,0
  "/>
  <!-- Port connectors on back (small rects at bottom) -->
  <rect x="284" y="300" width="36" height="26" rx="4" fill="#000"/>
  <rect x="330" y="300" width="36" height="26" rx="4" fill="#000"/>
  <rect x="376" y="300" width="36" height="26" rx="4" fill="#000"/>
</svg>
