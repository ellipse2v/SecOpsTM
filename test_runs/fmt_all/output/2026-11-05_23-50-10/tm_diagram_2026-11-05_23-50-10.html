    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
        }
        .diagram-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .svg-container {
            width: 98%;
            height: 98%;
            border: 1px solid #ddd;
            background-color: white;
        }
        .svg-container svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .navigation-ui {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }
        .legend-toggle-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-decoration: none;
            color: #333;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend-toggle-btn svg {
            width: 20px;
            height: 20px;
        }
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 5px;
        }
        .zoom-btn {
            width: 30px;
            height: 30px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .legend {
            position: absolute;
            top: 70px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #ddd;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            max-width: 200px;
            z-index: 1000;
        }
        .legend.hidden {
            display: none;
        }
        .legend-header {
            padding: 8px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }
        .legend-content {
            padding: 8px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
            padding: 1px 0;
            cursor: pointer;
            border-radius: 2px;
        }
        .legend-item:hover {
            background-color: rgba(0, 122, 204, 0.1);
        }
        .svg-element-hidden {
            display: none !important;
        }
        /* New styles for highlighting */
        .highlighted { /* Group-level styling for related elements */
            opacity: 1 !important;
        }
        /* Style ONLY the shapes of related elements */
        .highlighted path, .highlighted polygon, .highlighted ellipse {
            stroke: #007bff !important; /* Bright blue */
            stroke-width: 3px !important;
            transition: stroke 0.2s, stroke-width 0.2s;
        }
        /* More specific rule for EDGES to ensure they are highlighted */
        g.edge.highlighted path, g.edge.highlighted polygon {
            stroke: #007bff !important;
            stroke-width: 4px !important;
        }

        /* Ensure text within related elements remains readable */
        .highlighted text {
            stroke: none !important;
            fill: inherit !important;
        }

        .selected { /* Group-level styling for selected element */
            opacity: 1 !important;
        }
        /* Style ONLY the shapes of the selected element */
        .selected path, .selected polygon, .selected ellipse {
            stroke: red !important;
            stroke-width: 3px !important;
            fill: rgba(255, 0, 0, 0.15) !important; /* A more subtle fill */
            transition: stroke 0.2s, stroke-width 0.2s, fill 0.2s;
        }
        /* More specific rule for EDGES to ensure they are highlighted */
        g.edge.selected path, g.edge.selected polygon {
            stroke: red !important;
            stroke-width: 4px !important;
        }
        
        /* Ensure text within the selected element remains perfectly readable */
        .selected text {
            stroke: none !important;
            fill: inherit !important; /* Inherit original text color */
        }
        
        .faded {
            opacity: 0.5 !important;
            transition: opacity 0.2s ease-in-out;
        }
        /* Specific rules for text within faded elements to remain visible */
        .faded text {
            fill: inherit !important; /* Keep original text color */
            opacity: 1 !important;   /* Keep text opaque */
        }
        /* Remove graph-element's conflicting styles - let Graphviz set defaults, then override with !important */
        .graph-element {
            /* No conflicting fill/stroke here */
        }
    </style>

                    const g = svg.querySelector(`g[id="${CSS.escape(nodeId)}"]`);
                    if (!g) return;
                    const shape = g.querySelector('polygon,ellipse,path,rect');
                    if (!shape) return;
                    if (!originalNodeFills[nodeId]) {
                        originalNodeFills[nodeId] = { fill: shape.getAttribute('fill'), stroke: shape.getAttribute('stroke') };
                    }
                    const color = SEV_COLORS[level] || '#aaa';
                    shape.setAttribute('fill', color);
                    shape.setAttribute('stroke', color);
                });
                if (btn) { btn.textContent = '✕ Hide Heat Map'; btn.style.background = '#fee2e2'; }
            } else {
                // restore originals
                Object.entries(originalNodeFills).forEach(([nodeId, orig]) => {
                    const g = svg.querySelector(`g[id="${CSS.escape(nodeId)}"]`);
                    if (!g) return;
                    const shape = g.querySelector('polygon,ellipse,path,rect');
                    if (!shape) return;
                    if (orig.fill !== null) shape.setAttribute('fill', orig.fill);
                    else shape.removeAttribute('fill');
                    if (orig.stroke !== null) shape.setAttribute('stroke', orig.stroke);
                    else shape.removeAttribute('stroke');
                });
                if (btn) { btn.textContent = '⬤ Show Heat Map'; btn.style.background = '#f5f5f5'; }
            }

        function showSeverityTooltip(e, nodeId) {
            if (!severityOverlayActive) return;

            if (!level) return;
            const meta = globalGraphMetadata && globalGraphMetadata.nodes && globalGraphMetadata.nodes[nodeId];
            const label = meta ? meta.label : nodeId;
            const tip = document.getElementById('severity-tooltip');
            // Built with the DOM API: label/nodeId/REPORT_URL derive from model names.
            tip.textContent = '';

            strong.textContent = label;

        function hideSeverityTooltip() {

        // Function to apply highlighting
        function highlightElement(elementId) {
            // If the clicked element is already selected, clear highlighting and return.
            if (currentlySelectedElementId === elementId) {
                clearHighlighting();
                return;
            }

            // Clear previous highlighting
            clearHighlighting();
            currentlySelectedElementId = elementId;

            const svg = document.querySelector('#svg-container svg');
            if (!svg || !globalGraphMetadata) {
                return;
            }

            // Target element can be a node or an edge
            const targetElement = globalGraphMetadata.nodes[elementId] || globalGraphMetadata.edges[elementId];
            if (!targetElement) {
                return;
            }

            // Get all visible SVG groups (nodes and edges)
            const allSvgGroups = svg.querySelectorAll('g[id]');

            // Apply faded class to all elements first
            // Not the pan-zoom viewport (svg-pan-zoom gives it an id): fading it would
            // fade the selected element and the threat badges along with everything.
            allSvgGroups.forEach(g => {
                if (!g.classList.contains('svg-pan-zoom_viewport')) g.classList.add('faded');
            });

            // Highlight the selected element
            const selectedSvgElement = svg.querySelector(`g[id="${CSS.escape(elementId)}"]`);
            if (selectedSvgElement) {
                selectedSvgElement.classList.add('selected');
                selectedSvgElement.classList.remove('faded');
            }

            // Highlight connected elements
            const connectedElements = new Set();
            const connectedEdges = new Set();

            if (globalGraphMetadata.nodes[elementId]) { // If a node was clicked
                globalGraphMetadata.nodes[elementId].connections.forEach(edgeId => {
                    connectedEdges.add(edgeId);
                    const edge = globalGraphMetadata.edges[edgeId];
                    if (edge) {
                        connectedElements.add(edge.source);
                        connectedElements.add(edge.target);
                    }
                });
            } else if (globalGraphMetadata.edges[elementId]) { // If an edge was clicked
                const edge = globalGraphMetadata.edges[elementId];
                if (edge) {
                    connectedElements.add(edge.source);
                    connectedElements.add(edge.target);
                    connectedEdges.add(elementId);
                }
            }

            connectedElements.forEach(connId => {
                // Special handling for boundary clusters
                if (connId.startsWith('__hidden_node_')) {
                    const originalBoundaryId = connId.replace('__hidden_node_', '');
                    const boundaryCluster = svg.querySelector(`g[id="cluster_${CSS.escape(originalBoundaryId)}"]`);
                     if (boundaryCluster) {
                        boundaryCluster.classList.add('highlighted');
                        boundaryCluster.classList.remove('faded');
                    }
                }

                const connSvgElementActual = svg.querySelector(`g[id="${CSS.escape(connId)}"]`);
                if (connSvgElementActual) {
                    connSvgElementActual.classList.add('highlighted');
                    connSvgElementActual.classList.remove('faded');
                }
            });

            connectedEdges.forEach(edgeId => {
                const edgeSvgElement = svg.querySelector(`g[id="${CSS.escape(edgeId)}"]`);
                if (edgeSvgElement) {
                    edgeSvgElement.classList.add('highlighted');
                    edgeSvgElement.classList.remove('faded');
                }
            });
        }

        // Function to clear all highlighting
        function clearHighlighting() {
            const svg = document.querySelector('#svg-container svg');
            if (!svg) return;

            const allSvgGroups = svg.querySelectorAll('g[id]');
            allSvgGroups.forEach(g => {
                g.classList.remove('selected', 'highlighted', 'faded');
            });
            currentlySelectedElementId = null;
        }

        function toggleLegend() {
            const legend = document.getElementById('legend');
            legend.classList.toggle('hidden');
        }

        function toggleProtocolVisibility(protocolClass) {

            } else {

                if(legendItem) legendItem.style.opacity = 0.5;
            }

        function applyProtocolVisibility() {

ons\": [\"edge_MonolithicApp_DatabaseServer\", \"edge_DatabaseServer_MonolithicApp\"]}}, \"edges\": {\"edge_End_User_LoadBalancer\": {\"id\": \"edge_End_User_LoadBalancer\", \"source\": \"End_User\", \"target\": \"LoadBalancer\", \"protocol\": \"HTTPS\", \"label\": \"HTTP/S Request\"}, \"edge_LoadBalancer_MonolithicApp\": {\"id\": \"edge_LoadBalancer_MonolithicApp\", \"source\": \"LoadBalancer\", \"target\": \"MonolithicApp\", \"protocol\": \"HTTP/S\", \"label\": \"Web Request\"}, \"edge_MonolithicApp_DatabaseServer\": {\"id\": \"edge_MonolithicApp_DatabaseServer\", \"source\": \"MonolithicApp\", \"target\": \"DatabaseServer\", \"protocol\": \"JDBC/ODBC/API\", \"label\": \"Database Request\"}, \"edge_DatabaseServer_MonolithicApp\": {\"id\": \"edge_DatabaseServer_MonolithicApp\", \"source\": \"DatabaseServer\", \"target\": \"MonolithicApp\", \"protocol\": \"JDBC/ODBC/API\", \"label\": \"Database Response\"}, \"edge_MonolithicApp_LoadBalancer\": {\"id\": \"edge_MonolithicApp_LoadBalancer\", \"source\": \"MonolithicApp\", \"target\": \"LoadBalancer\", \"protocol\": \"HTTP/S\", \"label\": \"Web Response\"}, \"edge_LoadBalancer_End_User\": {\"id\": \"edge_LoadBalancer_End_User\", \"source\": \"LoadBalancer\", \"target\": \"End_User\", \"protocol\": \"HTTPS\", \"label\": \"HTTP/S Response\"}}}");

            // B2: inject severity map; hide overlay controls when no data
            const rawSeverityMap = JSON.parse("{\"LoadBalancer\": \"CRITICAL\", \"MonolithicApp\": \"CRITICAL\", \"DatabaseServer\": \"CRITICAL\", \"HTTP_S_Request\": \"HIGH\", \"Web_Request\": \"HIGH\", \"Database_Request\": \"HIGH\", \"Database_Response\": \"HIGH\", \"Web_Response\": \"HIGH\", \"HTTP_S_Response\": \"HIGH\", \"End_User\": \"HIGH\", \"Administrator\": \"HIGH\"}");

            } else {

                    controlIconsEnabled: false,
                    fit: true,
                    center: true,

                    const g = e.target.closest('.graph-element');

                    if (g) {
                        // A graph element (node or edge) was clicked
                        e.stopPropagation(); // Stop event from propagating further, just in case
                        highlightElement(g.id);
                    } else {

                        clearHighlighting();

                // Add graph-element class to all groups with an ID for easy identification by the listener
                const allSvgGroups = svgElement.querySelectorAll('g[id]');
                allSvgGroups.forEach(g => {
                    g.classList.add('graph-element');

                // B2: severity tooltip on hover
                svgElement.addEventListener('mousemove', (e) => {

                const legend = document.getElementById('legend');
                legend.addEventListener('click', (event) => {
                    const legendItem = event.target.closest('.legend-item');
                    if (legendItem) {
                        const protocolClass = legendItem.dataset.protocol;
                        if (protocolClass) {
                            toggleProtocolVisibility(protocolClass);
                        }
                    }
                });

                applyProtocolVisibility();

            } else {
                console.warn("SVG element not found for pan/zoom and highlighting initialization.");
            }
        });

<script>
(function () {
    const SVG_NS = 'http://www.w3.org/2000/svg';
    const LEVELS = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW'];
    const COLORS = { CRITICAL: '#dc2626', HIGH: '#ea580c', MEDIUM: '#d97706', LOW: '#16a34a' };
    const KIND_LABELS = { actor: 'Actor', server: 'Component', dataflow: 'Dataflow', boundary: 'Trust boundary' };
    const LAYER_REPORT_URL = "stride_mitre_report_2026-11-05_23-50-10.html";

    const state = { layer: {}, visible: true, levels: new Set(LEVELS), strides: null, openId: null, layerGroup: null };

    function svgRoot() { return document.querySelector('#svg-container svg'); }

    // Graphviz keeps the DOT id on nodes and edges; clusters get "clustN" with the
    // DOT name in their <title>, so fall back to the title.
    function findGroup(svg, id) {
        const byId = svg.querySelector(`g[id="${CSS.escape(id)}"]`);
        if (byId) return byId;
        for (const g of svg.querySelectorAll('g.cluster, g.node, g.edge')) {
            const t = g.querySelector(':scope > title');
            if (t && t.textContent.trim() === id) return g;
        }
        return null;
    }

    // Maps a point of `node`'s user space into the layer's user space. Works whatever
    // transforms sit in between (the generated SVG flips its y axis, pan-zoom scales).
    function toLayer(node, layerGroup, x, y) {
        const svg = svgRoot();
        const m = layerGroup.getScreenCTM().inverse().multiply(node.getScreenCTM());
        const p = svg.createSVGPoint();
        p.x = x; p.y = y;
        return p.matrixTransform(m);
    }

    function anchorPoint(g, kind, layerGroup) {
        if (kind === 'dataflow') {
            const path = g.querySelector('path');
            if (path && path.getTotalLength) {
                const mid = path.getPointAtLength(path.getTotalLength() / 2);
                return toLayer(path, layerGroup, mid.x, mid.y);
            }
        }
        // Element outline: its first own shape (icons are nested <svg>, skip them).
        const shape = g.querySelector(':scope > polygon, :scope > ellipse, :scope > rect, :scope > path, :scope > a > polygon, :scope > a > ellipse, :scope > a > rect, :scope > a > path')
            || g.querySelector('polygon, ellipse, rect, path') || g;
        const bb = shape.getBBox();
        const corners = [[bb.x, bb.y], [bb.x + bb.width, bb.y], [bb.x, bb.y + bb.height], [bb.x + bb.width, bb.y + bb.height]]
            .map(([x, y]) => toLayer(shape, layerGroup, x, y));
        const right = Math.max(...corners.map(c => c.x));
        const top = Math.min(...corners.map(c => c.y));
        if (kind === 'boundary') return { x: right - 14, y: top + 14 };
        return { x: right - 2, y: top + 2 };
    }

    // Badges keep the same on-screen size whatever the zoom level.
    function badgeScale(layerGroup) {
        const ctm = layerGroup.getScreenCTM();
        const zoom = ctm ? Math.hypot(ctm.a, ctm.b) : 1;
        return zoom > 0 ? 1 / zoom : 1;
    }

    // STRIDE filter: null = every category (including "Other"), else the selected set.
    function strideShown(stride) { return !state.strides || state.strides.has(stride); }

    // Visible threats of an element at one severity level, under the STRIDE filter.
    function levelCount(entry, lvl) {
        if (!state.levels.has(lvl)) return 0;
        if (!state.strides || !entry.by_stride) return entry.counts[lvl] || 0;
        return Object.entries(entry.by_stride)
            .reduce((n, [stride, perLevel]) => n + (strideShown(stride) ? (perLevel[lvl] || 0) : 0), 0);
    }

    function visibleCount(entry) {
        return LEVELS.reduce((n, lvl) => n + levelCount(entry, lvl), 0);
    }

    function worstVisible(entry) {
        return LEVELS.find(lvl => levelCount(entry, lvl) > 0) || null;
    }

    function plural(n, word) { return `${n} ${word}${n === 1 ? '' : 's'}`; }

    function buildBadges() {
        const svg = svgRoot();
        if (!svg) return;
        // Inside the pan-zoom viewport so badges pan with the diagram, on top of it.
        const host = svg.querySelector('.svg-pan-zoom_viewport') || svg;
        const layerGroup = document.createElementNS(SVG_NS, 'g');
        // A class, not an id: the page fades every g[id] when it highlights an element.
        layerGroup.setAttribute('class', 'threat-layer');
        state.layerGroup = layerGroup;
        host.appendChild(layerGroup);

        Object.entries(state.layer).forEach(([id, entry]) => {
            const target = findGroup(svg, id);
            if (!target) return;
            let pt;
            try { pt = anchorPoint(target, entry.kind, layerGroup); } catch (e) { return; }
            const badge = document.createElementNS(SVG_NS, 'g');
            badge.setAttribute('class', 'threat-badge');
            badge.dataset.elementId = id;
            badge._target = target;
            badge._pos = pt;
            const circle = document.createElementNS(SVG_NS, 'circle');
            const text = document.createElementNS(SVG_NS, 'text');
            const title = document.createElementNS(SVG_NS, 'title');
            badge.append(title, circle, text);
            badge.addEventListener('click', (e) => {
                // Keep the page's own click handler out of it: the badge does its own
                // highlighting, the same toggle a click on the element does.
                e.stopPropagation();
                e.preventDefault();
                if (entry.kind !== 'boundary' && typeof highlightElement === 'function') highlightElement(id);
                toggleThreatPanel(id);
            });
            layerGroup.appendChild(badge);
        });
        if (typeof panZoomInstance !== 'undefined' && panZoomInstance && panZoomInstance.setOnZoom) {
            panZoomInstance.setOnZoom(() => rescaleBadges());
        }
        window.addEventListener('resize', () => rescaleBadges());
        refreshThreatBadges();
    }

    function rescaleBadges() {
        const layerGroup = state.layerGroup;
        if (!layerGroup) return;
        const k = badgeScale(layerGroup);
        layerGroup.querySelectorAll('.threat-badge').forEach(badge => {
            badge.setAttribute('transform', `translate(${badge._pos.x},${badge._pos.y}) scale(${k})`);
        });
    }

    function refreshThreatBadges() {
        const layerGroup = state.layerGroup;
        if (!layerGroup) return;
        layerGroup.style.display = state.visible ? '' : 'none';
        layerGroup.querySelectorAll('.threat-badge').forEach(badge => {
            const entry = state.layer[badge.dataset.elementId];
            const n = visibleCount(entry);
            const worst = worstVisible(entry);
            const hiddenTarget = badge._target && badge._target.closest('.svg-element-hidden');
            if (!n || !worst || hiddenTarget) { badge.style.display = 'none'; return; }
            badge.style.display = '';
            const label = n > 99 ? '99+' : String(n);
            const circle = badge.querySelector('circle');
            circle.setAttribute('r', label.length > 1 ? 9 : 8);
            circle.setAttribute('fill', COLORS[worst]);
            badge.querySelector('text').textContent = label;
            badge.querySelector('title').textContent =
                `${entry.label}: ${plural(n, 'threat')} (worst: ${worst.toLowerCase()}). Click for details.`;
            badge.classList.toggle('active', state.openId === badge.dataset.elementId);
            badge.classList.toggle('dimmed', badge._target.classList.contains('faded'));
        });
        rescaleBadges();
        document.querySelectorAll('.threat-sev-filter').forEach(item => {
            item.classList.toggle('off', !state.levels.has(item.dataset.severity));
        });
        document.querySelectorAll('.threat-stride-filter').forEach(chip => {
            const on = !!state.strides && state.strides.has(chip.dataset.stride);
            chip.classList.toggle('on', on);
            chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        if (state.openId) renderPanel(state.openId);
    }

    function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text !== undefined) node.textContent = text;
        return node;
    }

    // Built with the DOM API only: labels and titles come from the model.
    function renderPanel(id) {
        const entry = state.layer[id];
        if (!entry) return;
        const title = document.getElementById('threat-panel-title');
        title.textContent = entry.label;
        title.appendChild(el('span', 'tp-kind', KIND_LABELS[entry.kind] || entry.kind));

        const summary = document.getElementById('threat-panel-summary');
        summary.textContent = '';
        LEVELS.forEach(lvl => {
            const n = entry.counts[lvl] || 0;
            if (!n) return;
            const chip = el('span', 'tp-chip', `${n} ${lvl.toLowerCase()}`);
            chip.style.background = COLORS[lvl];
            if (!levelCount(entry, lvl)) chip.style.opacity = '0.35';
            summary.appendChild(chip);
        });

        const list = document.getElementById('threat-panel-list');
        list.textContent = '';
        const shown = entry.threats.filter(t => state.levels.has(t.severity) && strideShown(t.stride));
        shown.forEach(t => {
            const li = el('li');
            const sev = el('span', 'tp-sev', t.score ? `${t.severity} ${t.score}` : t.severity);
            sev.style.background = COLORS[t.severity];
            li.appendChild(sev);
            li.appendChild(document.createTextNode(t.title));
            const meta = [t.stride, t.id, t.source && t.source !== 'pytm' ? t.source : ''].filter(Boolean).join(' · ');
            if (meta) li.appendChild(el('span', 'tp-meta', meta));
            list.appendChild(li);
        });
        if (!shown.length) list.appendChild(el('li', 'tp-meta', 'No threat matches the legend filters.'));

        const footer = document.getElementById('threat-panel-footer');
        footer.textContent = '';
        const listed = entry.threats.length;
        if (entry.total > listed) footer.appendChild(document.createTextNode(`Showing the ${listed} worst of ${entry.total} threats. `));
        // A report URL starting with a scheme ("javascript:...") is never a sibling file.
        if (LAYER_REPORT_URL && !/^\s*[a-z][a-z0-9+.\-]*:/i.test(LAYER_REPORT_URL)) {
            const link = el('a', '', 'Open in the full report →');
            link.href = LAYER_REPORT_URL + '#' + entry.anchor;
            link.target = '_top';
            footer.appendChild(link);
        }

    function openThreatPanel(id) {
        if (!state.layer[id]) return;
        state.openId = id;
        renderPanel(id);

    // Same toggle as the page's highlighting: a second click on the element closes it.
    function toggleThreatPanel(id) {
        if (state.openId === id) closeThreatPanel(); else openThreatPanel(id);
    }

    function closeThreatPanel() {
        state.openId = null;
        document.getElementById('threat-panel').classList.remove('open');

    function setThreatLayerVisible(visible) {
        state.visible = !!visible;
        const box = document.getElementById('threat-layer-toggle');
        if (box) box.checked = state.visible;
        if (!state.visible) closeThreatPanel();
        refreshThreatBadges();
    }

    // Click: show only this category (again: back to all). Shift/Ctrl/Cmd-click: add or
    // remove it from the current selection.
    function toggleThreatStride(stride, additive) {
        if (additive) {
            const next = new Set(state.strides || []);
            if (next.has(stride)) next.delete(stride); else next.add(stride);
            state.strides = next.size ? next : null;
        } else {
            const solo = state.strides && state.strides.size === 1 && state.strides.has(stride);
            state.strides = solo ? null : new Set([stride]);
        }
        refreshThreatBadges();
    }

    function toggleThreatSeverity(level) {
        if (state.levels.has(level)) state.levels.delete(level); else state.levels.add(level);
        refreshThreatBadges();
    }

    window.openThreatPanel = openThreatPanel;
    window.closeThreatPanel = closeThreatPanel;
    window.setThreatLayerVisible = setThreatLayerVisible;

            return;

        // The section is hidden by the page when it has no heat-map data; the layer needs it.
        const section = document.getElementById('severity-legend-section');
        if (section) section.style.display = '';

            item.addEventListener('click', () => toggleThreatSeverity(item.dataset.severity));
        });
        const strideTotals = {};
        Object.values(state.layer).forEach(e => Object.entries(e.by_stride || {}).forEach(([stride, perLevel]) => {
            strideTotals[stride] = (strideTotals[stride] || 0) + Object.values(perLevel).reduce((a, b) => a + b, 0);
        }));
        document.querySelectorAll('.threat-stride-filter').forEach(chip => {
            const n = strideTotals[chip.dataset.stride] || 0;
            chip.title = `${chip.dataset.stride}: ${plural(n, 'threat')}. Click to show only this category, Shift-click to combine.`;
            if (!n) chip.classList.add('empty');

        });

        if (svg) {
            // Clicking a node or dataflow that has threats toggles its panel (in step with

            // their badge only, so a click inside a boundary is not hijacked.
            svg.addEventListener('click', (e) => {
                if (!state.visible || e.target.closest('a')) return;
                // Nearest enclosing element of the layer (icons nest their own <g id>).
                let g = e.target;
                while (g && g !== svg && !(g.id && state.layer[g.id])) g = g.parentNode;

                else closeThreatPanel();  // also re-syncs badge dimming with the highlight
            });
        }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeThreatPanel(); });
    });
