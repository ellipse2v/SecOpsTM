name: New template model, asset type or protocol
description: Propose an example architecture for threatModel_Template/, or a new asset type or protocol mapping.
labels: [content, good first issue]
body:
  - type: markdown
    attributes:
      value: |
        New example models, asset types and protocols are the easiest way to contribute.
        See [CONTRIBUTING.md](https://github.com/ellipse2v/SecOpsTM/blob/main/CONTRIBUTING.md)
        and [CONTRIBUTING_ASSET_TYPES.md](https://github.com/ellipse2v/SecOpsTM/blob/main/CONTRIBUTING_ASSET_TYPES.md).
  - type: dropdown
    id: kind
    attributes:
      label: What do you want to add?
      options:
        - Example architecture (threatModel_Template/)
        - Asset type
        - Protocol
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: The architecture (main components, trust boundaries, flows), or the asset type / protocol and the ATT&CK techniques it relates to.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Public reference architectures, ATT&CK pages, vendor docs...
