name: Code Coverage Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
      with:
        # Matches venv-314. pytm>=1.4.0 requires Python >=3.11, and floating
        # pins ('3.x', '3.12') drift onto whatever's latest on the runner —
        # that's what pulled in Python 3.14 and surfaced pytm incompatibilities
        # never seen locally against the older venv-py310 (Python 3.10).
        python-version: '3.11'

    - name: Install System Dependencies (Graphviz)
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest

    - name: Run tests and generate coverage report
      run: |
        coverage run --source=threat_analysis -m pytest

    - name: Check coverage percentage
      run: |
        coverage report --fail-under=70