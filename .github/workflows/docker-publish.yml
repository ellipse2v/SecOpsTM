name: Docker — Build and Push

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ellipse2v
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push core image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: core
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ellipse2v/secopstm:core
            ellipse2v/secopstm:${{ steps.tag.outputs.VERSION }}-core
            ghcr.io/ellipse2v/secopstm:core
            ghcr.io/ellipse2v/secopstm:${{ steps.tag.outputs.VERSION }}-core
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ai image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: ai
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ellipse2v/secopstm:ai
            ellipse2v/secopstm:latest
            ellipse2v/secopstm:${{ steps.tag.outputs.VERSION }}
            ghcr.io/ellipse2v/secopstm:ai
            ghcr.io/ellipse2v/secopstm:latest
            ghcr.io/ellipse2v/secopstm:${{ steps.tag.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

