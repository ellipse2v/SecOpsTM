name: Docker — Build check

# Builds the image (amd64 + arm64, no push) on pull requests that touch what
# goes into it, so a broken Dockerfile or dependency set shows up before a
# release tag instead of after.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.dockerignore'
      - '.github/workflows/docker-build-check.yml'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: Set up QEMU (for arm64 cross-compilation)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build amd64 and load it
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: secopstm:check

      - name: Smoke test (CLI + one analysis)
        run: |
          docker run --rm secopstm:check --version
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/app/output" secopstm:check \
            --model-file threatModel_Template/Advanced_Cloud_WebApp/model.md --no-rag
          ls out/*/stride_mitre_report_*.html
          docker image ls secopstm:check --format 'Image size: {{.Size}}'

      - name: Build arm64
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5
        with:
          context: .
          platforms: linux/arm64
          push: false
