name: Live demo — GitHub Pages

# Regenerates the live demo (https://ellipse2v.github.io/SecOpsTM/) from the
# bundled templates with the rule engine only (no LLM, no RAG) and publishes
# it on GitHub Pages. Requires Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'threat_analysis/**'
      - 'threatModel_Template/Advanced_Cloud_WebApp/**'
      - 'threatModel_Template/On-Prem_Enterprise_Network/**'
      - 'tooling/build_demo_site.py'
      - 'docs/images/logo.svg'
      - '.github/workflows/pages-demo.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # Only what the rule engine and the report/diagram generators need:
      # the full requirements (chromadb, sentence-transformers) are for RAG.
      - name: Install SecOpsTM (rule engine only)
        run: |
          python -m pip install --upgrade pip
          pip install "pytm==1.4.0" "Flask[async]" waitress Jinja2 graphviz "pandas>=2.3.3" \
            PyYAML lxml openpyxl msoffcrypto-tool "aiohttp>=3.14.3" "litellm>=1.93.0" defusedxml scipy
          pip install --no-deps -e .

      - name: Build demo site
        run: python tooling/build_demo_site.py --out site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
